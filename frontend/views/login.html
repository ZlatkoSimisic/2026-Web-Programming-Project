<!-- Header-->
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Login</h1>
            <p class="lead fw-normal text-white-50 mb-0">Welcome back to ZlajaShop</p>
        </div>
    </div>
</header>
<!-- Section-->
<section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 mb-5">
                <div class="card h-100">
                    <!-- Login form-->
                    <div class="card-body p-4">
                        <h5 class="fw-bolder text-center mb-4">Sign in to your account</h5>
                        <form>
                            <div class="mb-3">
                                <label class="form-label" for="login-email">Email address</label>
                                <input class="form-control" id="login-email" type="email" placeholder="name@example.com" />
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="login-password">Password</label>
                                <div class="input-group">
                                    <input class="form-control" id="login-password" type="password" placeholder="Password" />
                                    <button class="btn btn-outline-dark toggle-password" type="button" aria-label="Show password"><i class="bi-eye"></i></button>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button class="btn btn-outline-dark" type="button">Login</button>
                            </div>
                        </form>
                    </div>
                    <!-- Register link-->
                    <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                        <div class="text-center">No account? <a class="text-dark fw-bolder" href="#register">Register</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
