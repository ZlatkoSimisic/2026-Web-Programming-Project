<!-- Header-->
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Register</h1>
            <p class="lead fw-normal text-white-50 mb-0">Create your ZlajaShop account</p>
        </div>
    </div>
</header>
<!-- Section-->
<section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-12 col-md-10 col-lg-6 mb-5">
                <div class="card h-100">
                    <!-- Register form-->
                    <div class="card-body p-4">
                        <h5 class="fw-bolder text-center mb-4">Create an account</h5>
                        <form>
                            <div class="row">
                                <div class="col-12 col-sm-6 mb-3">
                                    <label class="form-label" for="register-first-name">First name</label>
                                    <input class="form-control" id="register-first-name" type="text" placeholder="First name" />
                                </div>
                                <div class="col-12 col-sm-6 mb-3">
                                    <label class="form-label" for="register-last-name">Last name</label>
                                    <input class="form-control" id="register-last-name" type="text" placeholder="Last name" />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="register-email">Email address</label>
                                <input class="form-control" id="register-email" type="email" placeholder="name@example.com" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="register-password">Password</label>
                                <div class="input-group">
                                    <input class="form-control" id="register-password" type="password" placeholder="Password" />
                                    <button class="btn btn-outline-dark toggle-password" type="button" aria-label="Show password"><i class="bi-eye"></i></button>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="register-confirm-password">Confirm password</label>
                                <div class="input-group">
                                    <input class="form-control" id="register-confirm-password" type="password" placeholder="Confirm password" />
                                    <button class="btn btn-outline-dark toggle-password" type="button" aria-label="Show password"><i class="bi-eye"></i></button>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button class="btn btn-outline-dark" type="button">Register</button>
                            </div>
                        </form>
                    </div>
                    <!-- Login link-->
                    <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                        <div class="text-center">Already have an account? <a class="text-dark fw-bolder" href="#login">Login</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
